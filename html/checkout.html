<!DOCTYPE html>
<html lang="es">






<head>
    <meta charset="utf-8">

    <!-- window title and icon -->
    <title>Apex - Checkout</title>
    <link rel="icon" href="../img/favicon_triangle.png" type="image/png">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- google web fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet">

    <!-- icon font stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- customized bootstrap stylesheet -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">

    <!-- css and bootstrap templates stylesheet -->
    <link href="../css/style.css" rel="stylesheet">

    <!-- in-file css start -->
    <style>
        .checkout-wrapper {
            background: #f8f9fa;
            padding: 50px 0;
            min-height: 100vh;
            /* Para ocupar toda la pantalla en testing */
        }

        /* TARJETAS DE CRÉDITO */
        .credit-card-icons li {
            display: inline-block;
            margin-right: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            /* Borde transparente por defecto */
            padding: 5px;
            border-radius: 4px;
            transition: 0.2s;
            font-size: 2rem;
            /* Iconos grandes */
        }

        /* Solo mostramos borde al pasar el ratón, no fijo */
        .credit-card-icons li:hover {
            border-color: #ccc;
        }

        /* AJUSTES DE FORMULARIO */
        .form-control,
        .form-select {
            border-radius: 0;
            padding: 10px 15px;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: var(--bs-primary);
        }

        .card-header-custom {
            background: linear-gradient(to right, #f8f9fa, #fff);
            border-bottom: 1px solid #eee;
        }
    </style>
    <!-- in-file css end -->
</head>






<body>

    <!-- checkout start -->
    <div class="checkout-wrapper">
        <div class="container">

            <div class="row g-5 justify-content-center">

                <!-- payment details card start -->
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-0">

                        <!-- payment details title start -->
                        <div class="card-header card-header-custom p-4">
                            <h4 class="mb-0 text-primary"><i class="far fa-credit-card me-2"></i>Detalles del Pago</h4>
                        </div>
                        <!-- payment details title end -->

                        <div class="card-body p-4">
                            <form>

                                <!-- accepted cards start -->
                                <div class="mb-4">
                                    <label class="form-label fw-bold small text-uppercase">Tarjetas Aceptadas</label>
                                    <ul class="list-unstyled d-flex align-items-center credit-card-icons">
                                        <li><i class="fab fa-cc-visa text-primary"></i></li>
                                        <li><i class="fab fa-cc-mastercard text-danger"></i></li>
                                        <li><i class="fab fa-cc-amex text-info"></i></li>
                                    </ul>
                                </div>
                                <!-- accepted cards end -->

                                <!-- user-input start -->
                                <div class="row g-3">

                                    <!-- card owner start -->
                                    <div class="col-12">
                                        <label class="form-label">Nombre del Titular</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i
                                                    class="fa fa-user text-muted"></i></span>
                                            <input type="text" class="form-control"
                                                placeholder="Como aparece en la tarjeta" required>
                                        </div>
                                    </div>
                                    <!-- card owner end -->

                                    <!-- card number start -->
                                    <div class="col-12">
                                        <label class="form-label">Número de Tarjeta</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i
                                                    class="fa fa-credit-card text-muted"></i></span>
                                            <input type="text" class="form-control" placeholder="0000 0000 0000 0000"
                                                required>
                                        </div>
                                    </div>
                                    <!-- card number end -->

                                    <!-- card month start -->
                                    <div class="col-md-4">
                                        <label class="form-label">Mes</label>
                                        <select class="form-select">
                                            <option>01</option>
                                            <option>02</option>
                                            <option>03</option>
                                            <option>12</option>
                                        </select>
                                    </div>
                                    <!-- card month end -->

                                    <!-- card year start -->
                                    <div class="col-md-4">
                                        <label class="form-label">Año</label>
                                        <select class="form-select">
                                            <option>2024</option>
                                            <option>2025</option>
                                            <option>2026</option>
                                        </select>
                                    </div>
                                    <!-- card year end -->

                                    <!-- card cvv start -->
                                    <div class="col-md-4">
                                        <label class="form-label">CVV</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i
                                                    class="fa fa-lock text-muted"></i></span>
                                            <input type="password" class="form-control" placeholder="123">
                                        </div>
                                    </div>
                                    <!-- card cvv end -->
                                </div>
                                <!-- user-input end -->

                                <!-- secure message start -->
                                <div class="alert alert-light border mt-4 d-flex align-items-center">
                                    <i class="fas fa-lock text-success me-3 fs-4"></i>
                                    <small>Pago 100% seguro. Sus datos están encriptados.</small>
                                </div>
                                <!-- secure message end -->

                                <!-- payment button start -->
                                <a href="invoice.html"
                                    class="btn btn-primary w-100 py-3 mt-3 text-uppercase fw-bold text-center rounded-pill">
                                    Pagar ahora
                                </a>
                                <!-- payment button end -->
                            </form>
                        </div>
                    </div>
                </div>
                <!-- payment details card end -->


                <!-- purchase summary card start -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-0">

                        <!-- card title start -->
                        <div class="card-header bg-primary text-white p-4">
                            <h5 class="mb-0 text-white">Resumen de Compra</h5>
                        </div>
                        <!-- card title end -->


                        <div class="card-body p-4">

                            <!-- chosen tour 1 start -->
                            <div class="d-flex justify-content-between mb-2">
                                <span>Aventura Mediterránea</span>
                                <span>€1,200.00</span>
                            </div>
                            <!-- chosen tour 1 end -->

                            <!-- discount start -->
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Descuento</span>
                                <span class="text-success">-€0.00</span>
                            </div>
                            <!-- discount end -->

                            <hr>

                            <!-- total price start -->
                            <div class="d-flex justify-content-between mb-4">
                                <span class="fw-bold fs-5">Total</span>
                                <span class="fw-bold fs-5 text-primary">€1,200.00</span>
                            </div>
                            <!-- total price end -->

                            <!-- return packages start -->
                            <div class="d-grid">
                                <a href="packages.html" class="btn btn-outline-primary btn-sm">Seguir comprando</a>
                            </div>
                            <!-- return packages end -->
                        </div>
                    </div>
                </div>
                <!-- purchase summary card end -->

            </div>
        </div>
    </div>
    <!-- checkout end -->


    <!-- js libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
