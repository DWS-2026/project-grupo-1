openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: https://localhost:8443
  description: Generated server url
tags:
- name: Tours
  description: Gestión del catálogo de expediciones
- name: Guías
  description: Gestión de los guías de expedición
- name: Imágenes
  description: Servicio de almacenamiento y recuperación de archivos de imagen
- name: Autenticación
  description: "Endpoints públicos para el registro de usuarios, inicio de sesión\
    \ y gestión de tokens de seguridad"
- name: Usuarios
  description: "Gestión de perfiles, permisos, edición y estadísticas del sistema"
- name: Reservas
  description: Gestión de reservas de expediciones y tours
- name: Notificaciones
  description: Gestión de alertas del sistema (Privado - Solo ADMIN)
- name: Reviews
  description: Gestión de comentarios y valoraciones de los tours
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - Usuarios
      summary: Detalle de perfil específico
      description: Muestra información de un usuario concreto (Requiere ser el dueño
        de la cuenta o ADMIN).
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Perfil recuperado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserFullResponseDTO"
        "403":
          description: Ataque detectado (AO1 previsor)
        "404":
          description: El usuario no existe
    put:
      tags:
      - Usuarios
      summary: Edición general de cuenta
      description: "Si eres dueño edita campos base. Si eres ADMIN tienes permisos\
        \ de edición de cuenta total (Baneo, Modificar saldo, etc)."
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateDTO"
        required: true
      responses:
        "200":
          description: Modificado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserFullResponseDTO"
        "403":
          description: Intento ilegal de modificación a cuenta ajena
        "404":
          description: Usuario no detectado
    delete:
      tags:
      - Usuarios
      summary: Eliminar cuenta
      description: "Borra físicamente a un usuario del sistema (Requiere ADMIN). NOTA:\
        \ Los admin no pueden autoeliminarse por este endpoint."
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Cuenta borrada
        "403":
          description: Faltan permisos o prevención de auto-borrado ADMIN
        "404":
          description: Cuenta no encontrada
  /api/v1/users/{id}/image:
    put:
      tags:
      - Usuarios
      summary: Actualizar foto de perfil
      description: Sustituye la foto de perfil de cualquier persona. (Normalmente
        invocado por ADMIN).
      operationId: updateImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
              required:
              - imageFile
      responses:
        "204":
          description: Foto de perfil modificada
        "404":
          description: Usuario destino no localizado
  /api/v1/users/me:
    get:
      tags:
      - Usuarios
      summary: Obtener mi propio perfil
      description: Saca los datos asociados al usuario actual según su token de sesión.
      operationId: getMyProfile
      responses:
        "200":
          description: Datos correctos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserFullResponseDTO"
        "401":
          description: Debes iniciar sesión
    put:
      tags:
      - Usuarios
      summary: Editar mi perfil
      description: Actualiza los campos básicos del usuario autenticado de forma segura
        (sin roles ni dinero).
      operationId: updateMyProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateDTO"
        required: true
      responses:
        "200":
          description: Cambios guardados
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserFullResponseDTO"
        "401":
          description: Falta sesión
    delete:
      tags:
      - Usuarios
      summary: Eliminación de cuenta (por usuario)
      description: Permite a un usuario normal eliminar su propia cuenta de la base
        de datos.
      operationId: deleteMyAccount
      responses:
        "204":
          description: Baja finalizada
        "401":
          description: No has iniciado sesión
        "403":
          description: Los ADMINS deben darse de baja por base de datos directa para
            seguridad
  /api/v1/users/me/password:
    put:
      tags:
      - Usuarios
      summary: Actualizar contraseña
      description: Cambio de la clave personal validando primero la anterior.
      operationId: updateMyPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdateDTO"
        required: true
      responses:
        "204":
          description: Contraseña cambiada
        "400":
          description: Claves mal formadas o no coinciden
        "401":
          description: No autenticado
        "403":
          description: Contraseña antigua errónea
  /api/v1/users/me/image:
    put:
      tags:
      - Usuarios
      summary: Cambiar mi foto
      description: Petición multipart para cambiar la foto de perfil de mi cuenta
        personal.
      operationId: updateMyImage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        "204":
          description: Foto asignada
        "401":
          description: Error de sesión
    delete:
      tags:
      - Usuarios
      summary: Borrar mi foto de perfil
      description: "Quita la foto de perfil y elimina su blob en BDD, regresando al\
        \ avatar por defecto visualmente."
      operationId: deleteMyImage
      responses:
        "204":
          description: Imagen destruida
        "401":
          description: Sin sesión
  /api/v1/tours/{id}:
    get:
      tags:
      - Tours
      summary: Obtener un tour por ID
      description: "Obtiene los detalles de un tour. Si es oculto, requiere permisos\
        \ ADMIN."
      operationId: getTour
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Tour encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TourResponseDTO"
        "403":
          description: Acceso denegado a un tour oculto
        "404":
          description: No encontrado
    put:
      tags:
      - Tours
      summary: Reemplazar expedición
      description: "Actualiza todos los datos de un tour, incluida la foto. (Requiere\
        \ ADMIN)."
      operationId: replaceTour
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TourRequestDTO"
      responses:
        "404":
          description: Tour no encontrado
          content: {}
        "200":
          description: Actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TourResponseDTO"
        "403":
          description: Requiere rol ADMIN
    delete:
      tags:
      - Tours
      summary: Eliminar tour
      description: Borra físicamente una expedición. (Requiere ADMIN).
      operationId: deleteTour
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Tour eliminado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TourResponseDTO"
        "403":
          description: Acceso denegado
  /api/v1/tours/{id}/image/media:
    get:
      tags:
      - Tours
      summary: Descargar binario de la foto del tour
      description: Devuelve los bytes JPEG para renderizar la cabecera del tour.
      operationId: getTourImageFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Archivo recuperado
          content:
            image/jpeg: {}
        "403":
          description: Acceso denegado a archivo privado
        "404":
          description: No hay archivo vinculado
    put:
      tags:
      - Tours
      summary: Actualizar/Subir foto del tour
      description: Reemplaza el archivo JPEG del tour (Requiere ADMIN).
      operationId: uploadTourImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
              required:
              - imageFile
      responses:
        "201":
          description: Imagen vinculada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImageDTO"
        "400":
          description: El archivo enviado está vacío
        "403":
          description: Requiere permisos ADMIN
  /api/v1/reviews/{id}:
    get:
      tags:
      - Reviews
      summary: Obtener review por ID
      description: Busca una review específica. Da 404 si no existe o está oculta.
      operationId: obtenerReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: review encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponseDTO"
        "404":
          description: No existe o está oculta
    put:
      tags:
      - Reviews
      summary: Actualizar review
      description: Modifica estrellas o descripción saneando el contenido (Requiere
        ser autor o ADMIN).
      operationId: updateReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpdateDTO"
        required: true
      responses:
        "200":
          description: Actualizada correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponseDTO"
        "400":
          description: Datos no válidos
        "401":
          description: No autenticado
        "403":
          description: Sin permisos suficientes
        "404":
          description: review no encontrada
    delete:
      tags:
      - Reviews
      summary: Eliminar review
      description: Borra la review. Requiere ser el autor o ADMIN.
      operationId: deleteReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Eliminada con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponseDTO"
        "403":
          description: Sin permisos para gestionar esta review
        "404":
          description: Review no encontrada
  /api/v1/images/{id}/media:
    get:
      tags:
      - Imágenes
      summary: Descargar archivo binario
      description: Devuelve directamente el archivo binario (blob) de la imagen JPEG
        para renderizarla.
      operationId: getImageFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Archivo devuelto correctamente
          content:
            image/jpeg: {}
        "404":
          description: Imagen no encontrada o vacía
    put:
      tags:
      - Imágenes
      summary: Reemplazar un archivo de imagen
      description: Sustituye el contenido binario de una imagen conservando su ID.
      operationId: replaceImageFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
              required:
              - imageFile
      responses:
        "204":
          description: Archivo reemplazado correctamente
        "400":
          description: Archivo vacío
        "404":
          description: Imagen no encontrada
  /api/v1/guides/{id}:
    get:
      tags:
      - Guías
      summary: Obtener una guía por su ID
      operationId: getGuide
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Guía encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideResponseDTO"
        "404":
          description: Guía no encontrada
    put:
      tags:
      - Guías
      summary: Actualizar una guía existente
      description: Sustituye todos los datos de una guía identificada por su ID con
        la información proporcionada.
      operationId: replaceGuide
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuideRequestDTO"
        required: true
      responses:
        "200":
          description: Guía actualizada con éxito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideResponseDTO"
        "400":
          description: Datos de entrada inválidos o error en la validación
        "404":
          description: No se encontró ninguna guía con el ID proporcionada
    delete:
      tags:
      - Guías
      summary: Eliminar una guía
      description: Elimina de forma permanente una guía del sistema mediante su identificador
        único.
      operationId: deleteGuide
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Guía eliminada correctamente
        "404":
          description: La guía que se intenta eliminar no existe
  /api/v1/users/:
    post:
      tags:
      - Usuarios
      summary: Creación de usuario por administrador
      description: "Manual override: Fuerza la creación de cuenta, roles y dinero\
        \ gastado inicial. (Requiere ADMIN)"
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequestDTO"
        required: true
      responses:
        "201":
          description: Usuario Creado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserFullResponseDTO"
        "403":
          description: Privilegios insuficientes
  /api/v1/users:
    get:
      tags:
      - Usuarios
      summary: Listado paginado general
      description: Muestra todos los usuarios (Requiere ADMIN).
      operationId: getUsers
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Listado correcto
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageUserBasicResponseDTO"
        "403":
          description: No autorizado
    post:
      tags:
      - Usuarios
      summary: Creación de usuario por administrador
      description: "Manual override: Fuerza la creación de cuenta, roles y dinero\
        \ gastado inicial. (Requiere ADMIN)"
      operationId: createUser_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequestDTO"
        required: true
      responses:
        "201":
          description: Usuario Creado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserFullResponseDTO"
        "403":
          description: Privilegios insuficientes
  /api/v1/tours:
    get:
      tags:
      - Tours
      summary: Obtener catálogo de tours
      description: "Devuelve una página de tours. Los clientes ven solo los tours\
        \ visibles, los administradores los ven todos."
      operationId: getAllTours
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Catálogo obtenido exitosamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageTourResponseDTO"
    post:
      tags:
      - Tours
      summary: Crear expedición
      description: Crea un nuevo tour en base de datos. Exclusivo para administradores.
      operationId: createTour
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TourRequestDTO"
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                type: object
        "201":
          description: Tour creado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TourResponseDTO"
        "400":
          description: Falta imagen o datos malformados
        "403":
          description: Requiere rol ADMIN
  /api/v1/reviews:
    get:
      tags:
      - Reviews
      summary: Listar reviews visibles
      description: Devuelve todas las reviews almacenadas que no están ocultas.
      operationId: listarReviews
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Lista recuperada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageReviewResponseDTO"
    post:
      tags:
      - Reviews
      summary: Crear nueva review
      description: Crea y sanea (evitando XSS) una review vinculada al usuario autenticado.
      operationId: createReview
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestDTO"
        required: true
      responses:
        "201":
          description: review publicada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponseDTO"
        "400":
          description: Datos de entrada incorrectos
        "401":
          description: Usuario no autenticado
        "403":
          description: Intento de publicar en nombre de otro
  /api/v1/images/:
    post:
      tags:
      - Imágenes
      summary: Subir una nueva imagen
      description: Permite subir un archivo de imagen al sistema.
      operationId: createImage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
              required:
              - imageFile
      responses:
        "201":
          description: Imagen subida y registrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImageDTO"
        "400":
          description: Archivo vacío o inválido
  /api/v1/guides:
    get:
      tags:
      - Guías
      summary: Obtener todas las guías paginadas
      operationId: getGuides
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Lista de guías recuperada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageGuideResponseDTO"
    post:
      tags:
      - Guías
      summary: Crear una nueva guía
      operationId: createGuide
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuideRequestDTO"
        required: true
      responses:
        "201":
          description: Guía creada con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GuideResponseDTO"
        "400":
          description: Datos de entrada inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GuideResponseDTO"
  /api/v1/bookings/tours/{tourId}:
    post:
      tags:
      - Reservas
      operationId: addTour
      parameters:
      - name: tourId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingResponseDTO"
    delete:
      tags:
      - Reservas
      operationId: removeTour
      parameters:
      - name: tourId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingResponseDTO"
  /api/v1/bookings/me/checkout:
    post:
      tags:
      - Reservas
      operationId: checkout
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingResponseDTO"
  /api/v1/auth/register:
    post:
      tags:
      - Autenticación
      summary: Registrar un nuevo usuario
      description: Permite crear una nueva cuenta de usuario en el sistema. Se puede
        adjuntar de forma opcional una imagen de perfil.
      operationId: registerUser
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                userData:
                  $ref: "#/components/schemas/UserRegisterDTO"
                imageFile:
                  type: string
                  format: binary
              required:
              - userData
      responses:
        "201":
          description: Usuario registrado con éxito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserFullResponseDTO"
        "400":
          description: "Datos de registro inválidos (formato de correo incorrecto,\
            \ contraseñas débiles o campos obligatorios vacíos)"
  /api/v1/auth/refresh:
    post:
      tags:
      - Autenticación
      summary: Refrescar token de acceso
      description: Renueva un token de acceso JWT expirado utilizando la Cookie segura
        'RefreshToken' que tiene almacenada el navegador del usuario.
      operationId: refresh
      parameters:
      - name: RefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Token renovado con éxito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Token de refresco inválido o expirado
  /api/v1/auth/logout:
    post:
      tags:
      - Autenticación
      summary: Cerrar sesión
      description: Invalida la sesión actual del usuario y limpia las cookies HTTP-only
        de autenticación almacenadas en el navegador.
      operationId: logout
      responses:
        "200":
          description: Sesión cerrada correctamente
          content:
            text/plain: {}
  /api/v1/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: "Autentica las credenciales del usuario (email y contraseña). Si\
        \ son válidas, establece las cookies seguras y devuelve los tokens JWT de\
        \ acceso y refresco."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Credenciales incorrectas o payload de inicio de sesión corrupto
  /api/v1/users/{id}/status:
    patch:
      tags:
      - Usuarios
      summary: Suspender/Reactivar usuario
