
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Custom fonts for this template-->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body>
<!-- Admin Login - Bootstrap Only -->
<section class="vh-100 d-flex align-items-center" style="background-color: #f8f9fa;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-5 col-xl-4">
        <div class="card shadow rounded-4">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <img src="../img/logo_apex.png" alt="Admin Logo" width="120">
            </div>
            <h2 class="text-center mb-4 fw-bold">Panel de Administración</h2>
            <form action="index.html">
              <div class="mb-3">
                <label for="adminEmail" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="adminEmail" name="adminEmail" placeholder="admin@example.com" required>
              </div>
              <div class="mb-3">
                <label for="adminPassword" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="adminPassword" name="adminPassword" placeholder="Contraseña" required>
              </div>
              <div class="mb-3 d-flex justify-content-between align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="rememberAdmin">
                  <label class="form-check-label" for="rememberAdmin">Mantener sesión iniciada</label>
                </div>
                <a href="#!" class="link-primary">¿Olvidaste tu contraseña?</a>
              </div>
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg"> Iniciar sesión</button>
              </div>
              <p class="text-center text-secondary small mb-0">
                © 2026 Tu Empresa. Todos los derechos reservados.
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
