name: "CodeQL"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 1 * * 1' # Runs at 01:30 every Monday

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ] # Java and Kotlin analysis

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Setup Java Environment for Maven
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 2. Initialize CodeQL engine
    - name: Initialize CodeQL
      uses: actions/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # We use 'security-extended' to find more complex vulnerabilities 
        # similar to what ZAP reports (SQLi, XSS, etc.)
        queries: security-extended 

    # 3. Build the project
    # Autobuild usually works for Maven, but manual build is more robust
    - name: Build with Maven
      run: mvn clean compile -DskipTests

    # 4. Perform the analysis
    - name: Perform CodeQL Analysis
      uses: actions/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
