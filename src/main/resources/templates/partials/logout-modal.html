<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold text-white" id="logoutModalLabel">
                    <i class="fas fa-sign-out-alt me-2 text-white"></i>Cerrar sesión
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>


            <div class="modal-body">
                {{#currentUser}}
                <div class="mb-3">
                    {{#hasProfilePicture}}
                    <img src="/user/{{id}}/image"
                         alt="Foto de perfil"
                         class="rounded-circle border border-3 border-primary"
                         style="width: 100px; height: 100px; object-fit: cover;">
                    {{/hasProfilePicture}}

                    {{^hasProfilePicture}}
                    <i class="fas fa-user-circle fa-5x text-secondary"></i>
                    {{/hasProfilePicture}}
                </div>

                <h4 class="mb-1">{{name}} {{lastName}}</h4>
                <p class="text-muted">{{email}}</p>
                <p>¿Estás seguro de que quieres salir?</p>
                {{/currentUser}}
            </div>

            <div class="modal-footer justify-content-center bg-light">
                <button type="button" class="btn btn-dark" data-bs-dismiss="modal">Cancelar</button>

                <form action="/logout" method="post">
                    <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-sign-out-alt me-2"></i>Salir
                    </button>
                </form>
            </div>


        </div>
    </div>
</div>
