<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Apex Expeditions - 403</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />

<body>

{{>partials/navbar}}

<div class="container-fluid bg-breadcrumb">

    <ol class="breadcrumb justify-content-center mb-0">
      <li class="breadcrumb-item active text-white">Acceso denegado</li>
    </ol>
  </div>
</div>
<div class="container-fluid py-5"
     style="background: linear-gradient(rgba(19, 53, 123, 0.1), rgba(19, 53, 153, 0.1)); object-fit: cover;">

    <div class="row justify-content-center">
      <div class="col-lg-6">
        <i class="bi bi-exclamation-octagon display-1 text-danger"></i>
        <h1 class="display-1">403</h1>

        </p>
        <a class="btn btn-primary rounded-pill py-3 px-5" href="/">Volver a inicio</a>

    </div>
  </div>
</div>
{{>partials/footer}}

<a href="#" class="btn btn-primary btn-primary-outline-0 btn-md-square back-to-top"><i
        class="fa fa-arrow-up"></i></a>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
