<!DOCTYPE html>
<html lang="es">






<head>
    <meta charset="utf-8">

    <!-- window title and icon -->
    <title>Apex - Perfil</title>
    <link rel="icon" href="/images/favicon_triangle.png" type="image/png">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- google web fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet"> 

    <!-- icon font stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- customized bootstrap stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- external css -->
    <link href="/css/style.css" rel="stylesheet">

    <!-- in-file css start -->
    <style>
        .bg-secondary-soft {
            background-color: rgba(208, 212, 217, 0.1) !important;
        }
        .file-upload .square {
            height: 250px;
            width: 250px;
            margin: auto;
            vertical-align: middle;
            border: 1px solid #e5dfe4;
            background-color: #fff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .text-secondary {
            --bs-text-opacity: 1;
            color: rgba(208, 212, 217, 0.5) !important;
        }
        .btn-success-soft {
            color: #28a745;
            background-color: rgba(40, 167, 69, 0.1);
        }
        .btn-danger-soft {
            color: #dc3545;
            background-color: rgba(220, 53, 69, 0.1);
        }
    </style>
    <!-- in-file css end -->

</head>






<body>
{{>partials/navbar}}




<!-- banner + breadcrumbs start -->
    <div class="container-fluid bg-breadcrumb">
        <div class="container text-center py-5" style="max-width: 900px;">
            <h3 class="text-white display-3 mb-4">Mi perfil</h3>
            <ol class="breadcrumb justify-content-center mb-0">
                <li class="breadcrumb-item"><a href="/">Inicio</a></li>
                <li class="breadcrumb-item active text-white">Mi perfil</li>
            </ol>    
        </div>
    </div>
    <!-- banner + breadcrumbs start -->


    <!-- profile start -->
    <div class="container py-5">
        <div class="row">
            <div class="col-12">

                <!-- title start -->
                <div class="my-5">
                    <h3>Actualizar perfil</h3>
                    <hr>
                </div>
                <!-- title end -->

                <form class="file-upload">
                    <div class="row mb-5 gx-5">
                        <div class="col-xxl-8 mb-5 mb-xxl-0">
                            
                            <!-- details form start -->
                            <div class="bg-secondary-soft px-4 py-5 rounded">
                                <div class="row g-3">
                                    <h4 class="mb-4 mt-0">Detalles</h4>
                                    <div class="col-md-6">
                                        <label class="form-label">Nombre *</label>
                                        <input type="text" class="form-control" placeholder="Scaralet" aria-label="First name">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Apellidos *</label>
                                        <input type="text" class="form-control" placeholder="Doe" aria-label="Last name">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Número de teléfono principal *</label>
                                        <input type="text" class="form-control" placeholder="(333) 000 555" aria-label="Phone number">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Número de teléfono secundario *</label>
                                        <input type="text" class="form-control" placeholder="+91 9852 8855 252" aria-label="Phone number">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="inputEmail4" class="form-label">Correo electrónico *</label>
                                        <input type="email" class="form-control" id="inputEmail4" placeholder="ejemplo@ejemplo.com">
                                    </div>
                                </div>
                            </div>
                            <!-- details form start -->

                        </div>

                        <!-- pfp section start -->
                        <div class="col-xxl-4">
                            <div class="bg-secondary-soft px-4 py-5 rounded">
                                <div class="row g-3">
                                    <h4 class="mb-4 mt-0">Sube tu foto de perfil</h4>
                                    <div class="text-center">
                                        <div class="square position-relative display-2 mb-3">
                                            <i class="fas fa-fw fa-user position-absolute top-50 start-50 translate-middle text-secondary"></i>
                                        </div>
                                        <input type="file" id="customFile" name="file" hidden="">
                                        <label class="btn btn-success-soft btn-block" for="customFile" style="cursor: pointer;">Actualizar</label>
                                        <button type="button" class="btn btn-danger-soft">Eliminar</button>
                                        <p class="text-muted mt-3 mb-0"><span class="me-1">Aviso:</span>Dimensiones mínimas size 300px x 300px</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- pfp section end -->

                    </div> 

                    <!-- social media + password start -->
                    <div class="row mb-5 gx-5">

                        <!-- social media start -->
                        <div class="col-xxl-6 mb-5 mb-xxl-0">
                            <div class="bg-secondary-soft px-4 py-5 rounded">
                                <div class="row g-3">
                                    <h4 class="mb-4 mt-0">Redes sociales</h4>
                                    <div class="col-md-6">
                                        <label class="form-label"><i class="fab fa-fw fa-facebook me-2 text-facebook"></i>Facebook *</label>
                                        <input type="text" class="form-control" placeholder="http://www.facebook.com" aria-label="Facebook">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label"><i class="fab fa-fw fa-twitter text-twitter me-2"></i>Twitter *</label>
                                        <input type="text" class="form-control" placeholder="http://www.twitter.com" aria-label="Twitter">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label"><i class="fab fa-fw fa-linkedin-in text-linkedin me-2"></i>Linkedin *</label>
                                        <input type="text" class="form-control" placeholder="http://www.linkedin.com" aria-label="Linkedin">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label"><i class="fab fa-fw fa-instagram text-instagram me-2"></i>Instagram *</label>
                                        <input type="text" class="form-control" placeholder="http://www.instragram.com" aria-label="Instragram">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- social media start -->

                        <!-- password change start -->
                        <div class="col-xxl-6">
                            <div class="bg-secondary-soft px-4 py-5 rounded">
                                <div class="row g-3">
                                    <h4 class="my-4">Cambiar contraseña</h4>
                                    <div class="col-md-6">
                                        <label for="exampleInputPassword1" class="form-label">Contraseña antigüa *</label>
                                        <input type="password" class="form-control" id="exampleInputPassword1">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="exampleInputPassword2" class="form-label">Contraseña nueva *</label>
                                        <input type="password" class="form-control" id="exampleInputPassword2">
                                    </div>
                                    <div class="col-md-12">
                                        <label for="exampleInputPassword3" class="form-label">Confirmar contraseña nueva *</label>
                                        <input type="password" class="form-control" id="exampleInputPassword3">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- password change end -->

                    </div> 
                    <!-- social media + password end -->
                    
                    <!-- bottom buttons start -->
                    <div class="gap-3 d-md-flex justify-content-md-end text-center mb-5">
                        <button type="button" class="btn btn-danger btn-lg">Eliminar perfil</button>
                        <button type="button" class="btn btn-primary btn-lg">Actualizar perfil</button>
                    </div>
                    <!-- bottom buttons end -->

                </form> 
            </div>
        </div>
    </div>
    <!-- profile end -->



{{>partials/footer}}


<!-- back to top -->
<a href="#" class="btn btn-primary btn-primary-outline-0 btn-md-square back-to-top"><i class="fa fa-arrow-up"></i></a>

<!-- js libraries -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

    

</body>
</html>
