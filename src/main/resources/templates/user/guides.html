<!DOCTYPE html>
<html lang="es">






<head>
    <meta charset="utf-8">

    <!-- window title and icon -->
    <title>Apex - Guías</title>
    <link rel="icon" href="/images/favicon_triangle.png" type="image/png">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- google web fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet">

    <!-- icon font stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- css and bootstrap templates stylesheet -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">

    <!-- internal css start -->
    <style>
        /* guide cards customization */
        .guide-item {
            opacity: 1 !important;
            transform: none !important;
            transition: all 0.3s ease !important;
        }

        .guide-item:hover {
            transform: translateY(-10px) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1) !important;
        }

        .guide-img {
            position: relative !important;
            overflow: hidden !important;
        }

        .guide-img img {
            transition: transform 0.5s ease !important;
            width: 100% !important;
            height: auto !important;
        }

        .guide-item:hover .guide-img img {
            transform: scale(1.1) !important;
        }

        .guide-icon {
            position: absolute !important;
            bottom: 15px !important;
            right: 15px !important;
            opacity: 0 !important;
            transform: translateY(20px) !important;
            transition: all 0.3s ease !important;
            background: rgb(220, 53, 69) !important;
        }

        .guide-item:hover .guide-icon {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        /* hide spinner */
        #spinner {
            display: none !important;
        }

        .guide-img {
            height: 410px;
            overflow: hidden;
        }

        .guide-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
    <!-- internal css end -->
</head>






<body>
{{>partials/navbar}}


<!-- banner + breadcrumbs start -->
    <div class="container-fluid bg-breadcrumb">
        <div class="container text-center py-5" style="max-width: 900px;">
            <h3 class="text-white display-3 mb-4">Nuestros guías de viaje</h3>
            <ol class="breadcrumb justify-content-center mb-0">
                <li class="breadcrumb-item"><a href="/">Inicio</a></li>
                <li class="breadcrumb-item active text-white">Guías</li>
            </ol>
        </div>
    </div>
    <!-- banner + breadcrumbs end -->


    <!-- page content start -->
    <div class="container-fluid guide py-5">
        <div class="container py-5">

            <!-- titles start -->
            <div class="mx-auto text-center mb-5" style="max-width: 900px;">
                <h5 class="section-title px-3">Guías de viaje</h5>
                <h1 class="mb-0">Conoce a nuestros guías expertos</h1>
            </div>
            <!-- titles end -->

            <!-- guide cards start -->
            <div class="row g-4">
                {{#guides}}
                <div class="col-md-6 col-lg-3">
                    <div class="guide-item">
                        <div class="guide-img">

                            {{#hasProfilePicture}}
                            <img src="/admin/guides/{{id}}/image" class="img-fluid w-100 rounded-top">
                            {{/hasProfilePicture}}

                            {{^hasProfilePicture}}
                            <img src="/images/default-guide.jpg" class="img-fluid w-100 rounded-top">
                            {{/hasProfilePicture}}

                            <div class="guide-icon rounded-pill p-2">
                                <a class="btn btn-square btn-primary rounded-circle mx-1" href="#"><i class="fab fa-facebook-f"></i></a>
                                <a class="btn btn-square btn-primary rounded-circle mx-1" href="#"><i class="fab fa-twitter"></i></a>
                                <a class="btn btn-square btn-primary rounded-circle mx-1" href="#"><i class="fab fa-instagram"></i></a>
                                <a class="btn btn-square btn-primary rounded-circle mx-1" href="#"><i class="fab fa-linkedin-in"></i></a>
                            </div>

                        </div>

                        <div class="guide-title text-center rounded-bottom p-4">
                            <div class="guide-title-inner">

                                <h4 class="mt-3">{{name}} {{lastName}}</h4>

                                <p class="mb-0">
                                    {{tour.name}}
                                </p>

                            </div>
                        </div>
                    </div>
                </div>
                {{/guides}}

                </div>
        </div>
    </div>
    <!-- page content end -->


{{>partials/footer}}




    <!-- back to top -->
    <a href="#" class="btn btn-primary btn-primary-outline-0 btn-md-square back-to-top"><i
            class="fa fa-arrow-up"></i></a>


    <!-- js libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>




</body>

</html>
