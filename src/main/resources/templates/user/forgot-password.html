<!DOCTYPE html>
<html lang="es">






<head>
  <meta charset="utf-8">

  <!-- window title and icon -->
  <link rel="icon" href="/images/favicon_triangle.png" type="image/png">
  <title>Apex - Recuperar contraseña</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <!-- google web fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet">

  <!-- icon font stylesheet -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- customized bootstrap stylesheet -->
  <link href="/css/bootstrap.min.css" rel="stylesheet">

  <!-- external css -->
  <link href="/css/style.css" rel="stylesheet">

  <!-- in-file css start -->
  <style>
    .auth-card {
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(0, 0, 0, .08);
      border-radius: 14px;
      background: #fff;
    }

    .auth-card-header {
      background: rgba(220, 53, 69, 0.06);
      border-bottom: 1px solid rgba(0, 0, 0, .05);
    }

    .auth-logo {
      max-height: 70px;
    }
  </style>
  <!-- in-file css end -->
</head>






<body>
{{>partials/navbar}}




<!-- banner + breadcrumbs start -->
  <div class="container-fluid bg-breadcrumb">
    <div class="container text-center py-5">
      <h3 class="text-white display-3 mb-4">Recuperar contraseña</h3>
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
        <li class="breadcrumb-item active text-white">Recuperar contraseña</li>
      </ol>
    </div>
  </div>
  <!-- banner + breadcrumbs end -->



  <!-- recover password start -->
  <div class="container py-5">
    <div class="auth-card">

      <!-- title + logo -->
      <div class="auth-card-header p-4 text-center">
        <img src="/images/logo_apex.png" class="auth-logo mb-2">
        <h2 class="h4">¿Olvidaste tu contraseña?</h2>
        <p class="text-muted">Introduce tu email para recibir instrucciones</p>
      </div>
      <!-- title + logo -->

      <div class="p-4 p-md-5">
        <form id="recoverForm">

          <!-- email start -->
          <div class="mb-3 form-floating">
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            <label for="email">Correo electrónico</label>
          </div>
          <!-- email start -->

          <!-- button send start -->
          <div class="d-grid mb-3">
            <button class="btn btn-primary btn-lg" type="submit">
              Enviar recuperación
            </button>
          </div>
          <!-- button send end -->

          <!-- success message -->
          <p id="mensaje" class="text-success text-center"></p>

          <!-- return to login button start -->
          <div class="text-center">
            <a href="login.html" class="text-decoration-none">Volver al login</a>
          </div>
          <!-- return to login button end -->

        </form>
      </div>
    </div>
  </div>
  <!-- recover password end -->







 {{>partials/footer}}

  <!-- back to top -->
  <a href="#" class="btn btn-primary btn-primary-outline-0 btn-md-square back-to-top"><i class="fa fa-arrow-up"></i></a>


  
  <!-- js libraries -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>


  <!--post-button popup start -->
  <script>
    document.getElementById("recoverForm").addEventListener("submit", function (e) {
      e.preventDefault();

      let email = document.getElementById("email").value;

      document.getElementById("mensaje").textContent =
        "Si el correo existe, recibirás instrucciones para restablecer tu contraseña.";
    });
  </script>
  <!--post-button popup end-->
</body>
</html>
