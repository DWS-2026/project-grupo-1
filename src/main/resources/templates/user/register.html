<!DOCTYPE html>
<html lang="es">






<head>
  <meta charset="utf-8">

  <!-- window title and icon -->
  <title>Apex - Registro</title>
  <link rel="icon" href="/images/favicon_triangle.png" type="image/png">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <!-- google web fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet">

  <!-- icon font stylesheet -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- customized bootstrap stylesheet -->
  <link href="/css/bootstrap.min.css" rel="stylesheet">

  <!-- css external file -->
  <link href="/css/style.css" rel="stylesheet">


  <!-- in-file css start -->
  <style>
    /* Small page-specific styling to make the register card look good */
    .auth-card {
      max-width: 520px;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(0, 0, 0, .08);
      border: 1px solid rgba(0, 0, 0, .05);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .auth-card-header {
      background: rgba(220, 53, 69, 0.06);
      border-bottom: 1px solid rgba(0, 0, 0, .05);
    }

    .auth-logo {
      max-height: 70px;
    }
  </style>
  <!-- in-file css end -->

</head>






<body>
{{>partials/navbar}}




<!-- banner + breadcrumbs start -->
  <div class="container-fluid bg-breadcrumb">
    <div class="container text-center py-5" style="max-width: 900px;">
      <h3 class="text-white display-3 mb-4">Registro</h3>
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="/">Inicio</a></li>
        <li class="breadcrumb-item active text-white">Registro</li>
      </ol>
    </div>
  </div>
  <!-- banner + breadcrumbs end -->



  <!-- register start -->
  <div class="container py-5">
    <div class="auth-card">

      <!-- card head start -->
      <div class="auth-card-header p-4 text-center">
        <a href="/" class="d-inline-block mb-2">
          <img src="/images/logo_apex.png" alt="Apex Expeditions" class="auth-logo">
        </a>
        <h2 class="h4 mb-1">Crea tu cuenta</h2>
        <p class="text-muted mb-0">Registrese para pedir presupuestos y poder comprar viajes.</p>
      </div>
      <!-- card head end -->

      <div class="p-4 p-md-5">

        <form action="/register" method="POST">
          <input type="hidden" name="_csrf" value="{{_csrf.token}}">
          <div class="row g-3">

            <!-- name start -->
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" name="name" id="name" placeholder="Nombre" required>
                <label for="name">Nombre</label>
              </div>
            </div>
            <!-- name end -->

            <!-- surname start -->
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" name="lastName" id="lastName" placeholder="Apellidos" required>
                <label for="lastName">Apellidos</label>
              </div>
            </div>
            <!-- surname end -->

            <!-- email start -->
            <div class="col-12">
              <div class="form-floating">
                <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com"
                  required>
                <label for="email">Correo electrónico</label>
              </div>
            </div>
            <!-- email end -->


            <!-- main phone start -->
            <div class="col-12">
              <div class="form-floating">
                <input type="text" class="form-control" name="mainPhone" id="mainPhone" placeholder="600000000" required>
                <label for="mainPhone">Teléfono móvil</label>
              </div>
            </div>
            <!-- main phone end -->

            <!-- password start -->
            <div class="col-12">
              <div class="form-floating">
                <input type="password" class="form-control" name="password" id="password" placeholder="Password"
                  required>
                <label for="password">Contraseña</label>
              </div>
            </div>
            <!-- password end -->

            <!-- terms start -->
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" name="iAgree" id="iAgree" required>
                <label class="form-check-label text-muted" for="iAgree">
                  Acepto los <a href="#" class="link-primary text-decoration-none">términos y condiciones</a>
                </label>
              </div>
            </div>
            <!-- terms end -->

            <!-- account creation button start -->
            <div class="col-12">
              <div class="d-grid">
                <button class="btn btn-primary btn-lg" type="submit">Crear cuenta</button>
              </div>
            </div>
            <!-- account creation button end -->

            <!-- login redirect start -->
            <div class="col-12 text-center">
              <p class="m-0 text-muted">
                ¿Tienes ya una cuenta?
                <a href="/login" class="link-primary text-decoration-none">Iniciar sesión</a>
              </p>
            </div>
            <!-- login redirect end -->

          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- register end -->


{{>partials/footer}}


  <!-- back to top -->
  <a href="#" class="btn btn-primary btn-primary-outline-0 btn-md-square back-to-top"><i class="fa fa-arrow-up"></i></a>



  <!-- js libraries -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
