<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Editar Review">
    <meta name="author" content="">

    <title>SB Admin 2 - Editar Review</title>

    <!-- Custom fonts for this template -->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="/https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <div id="sidebar"></div>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <div id="topbar"></div>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Editar Review</h6>
                        </div>
                        <div class="card-body">
                            <form id="editReviewForm">
                                <div class="form-group">
                                    <label for="tourName">Nombre del Tour</label>
                                    <input type="text" class="form-control" id="tourName" value="Viaje al futuro">
                                </div>
                                <div class="form-group">
                                    <label for="duration">Duración</label>
                                    <input type="text" class="form-control" id="duration" value="3 días">
                                </div>
                                <div class="form-group">
                                    <label for="author">Autor</label>
                                    <input type="text" class="form-control" id="author" value="John Doe">
                                </div>
                                <div class="form-group">
                                    <label for="hotel">Hotel</label>
                                    <input type="text" class="form-control" id="hotel" value="Incluido">
                                </div>
                                <div class="form-group">
                                    <label for="description">Descripción</label>
                                    <textarea class="form-control" id="description" rows="4">Una experiencia inolvidable. La guía fue excelente y los lugares visitados superaron mis expectativas. ¡Muy recomendado!</textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                                <a href="/admin/reviews" class="btn btn-secondary">Volver</a>
                            </form>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <div id="footer"></div>
            <!-- End of Footer -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button--> 
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal--> 
    <div id="logout-modal"></div>

    <!-- Bootstrap core JavaScript--> 
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript--> 
    <script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages--> 
    <script src="/js/sb-admin-2.min.js"></script>

    <script>
        fetch("/admin/components/sidebar.html")
            .then(res => res.text())
            .then(data => document.getElementById("sidebar").innerHTML = data);

        fetch("/admin/components/topbar.html")
            .then(res => res.text())
            .then(data => document.getElementById("topbar").innerHTML = data);

        fetch("/admin/components/footer.html")
            .then(res => res.text())
            .then(data => document.getElementById("footer").innerHTML = data);

        fetch("/admin/components/logout-modal.html")
            .then(res => res.text())
            .then(data => document.getElementById("logout-modal").innerHTML = data);
    </script>

</body>

</html>
