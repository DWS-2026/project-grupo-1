<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Editar Tour</title>


    <link rel="icon" href="/images/favicon_admin.png" type="image/png">

    <!-- Fonts -->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">

    <!-- Styles -->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

</head>

<body id="page-top">

    <div id="wrapper">

        <!-- Sidebar -->
        {{>admin/partials/sidebar}}

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                {{>admin/partials/topbar}}

                <!-- Page Content -->
                <div class="container-fluid">

                    <h1 class="h3 mb-4 text-gray-800">Editar Tour</h1>

                    <div class="card shadow mb-4">

                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Datos del tour</h6>
                        </div>

                        <div class="card-body">

                            <form action="/admin/tour-edit/{{tour.id}}" method="post" enctype="multipart/form-data">
                                <input type="hidden" name="_csrf" value="{{_csrf.token}}" />

                                <!-- Nombre -->
                                <div class="form-group">
                                    <label>Nombre del tour</label>
                                    <input type="text" class="form-control" name="name" value="{{tour.name}}">
                                </div>

                                <!-- Precio -->
                                <div class="form-group">
                                    <label>Precio (€)</label>
                                    <input type="number" step="0.01" class="form-control" name="price"
                                        value="{{tour.price}}">
                                </div>

                                <!-- Duración -->
                                <div class="form-group">
                                    <label>Duración</label>
                                    <input type="text" class="form-control" name="duration" value="{{tour.duration}}">
                                </div>

                                <!-- Personas -->
                                <div class="form-group">
                                    <label>Número de personas</label>
                                    <input type="number" class="form-control" name="numPeople"
                                        value="{{tour.numPeople}}">
                                </div>

                                <!-- Hotel -->
                                <div class="form-group">
                                    <label>Hotel incluido</label>
                                    <select class="form-control" name="hotelIncluded">
                                        <option value="true" {{#tour.hotelIncluded}}selected{{/tour.hotelIncluded}}>
                                            Incluido</option>
                                        <option value="false" {{^tour.hotelIncluded}}selected{{/tour.hotelIncluded}}>No
                                            incluido</option>
                                    </select>
                                </div>

                                <!-- Descripción -->
                                <div class="form-group">
                                    <label>Descripción</label>
                                    <textarea class="form-control" name="description"
                                        rows="4">{{tour.description}}</textarea>
                                </div>

                                <!-- Imagen -->
                                <div class="form-group">
                                    <label>Imagen del tour</label>
                                    <input type="file" class="form-control-file" name="imageFile">
                                </div>

                                {{#tour.tourImage}}
                                <div class="mb-3">
                                    <img src="data:image/jpeg;base64,{{tour.tourImage}}" width="300"
                                        alt="{{tour.name}}">
                                </div>
                                {{/tour.tourImage}}
                                {{^tour.tourImage}}
                                <p>No hay imagen disponible</p>
                                {{/tour.tourImage}}

                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save"></i> Guardar cambios
                                </button>

                                <a href="/admin/tours" class="btn btn-secondary">
                                    Cancelar
                                </a>

                            </form>

                        </div>
                    </div>

                </div>
                <!-- End Page Content -->

            </div>
            <!-- End Main Content -->

            <!-- Footer -->
            {{>admin/partials/footer}}

        </div>
        <!-- End Content Wrapper -->

    </div>
    <!-- End Page Wrapper -->

    <!-- Scroll -->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal -->
    {{>admin/partials/logout-modal}}

    <!-- Scripts -->
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="/js/sb-admin-2.min.js"></script>

</body>

</html>
