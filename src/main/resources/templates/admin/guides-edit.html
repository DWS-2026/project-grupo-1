<!DOCTYPE html> 
<html lang="en"> 
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="/images/favicon_admin.png" type="image/png">

    <title>SB Admin 2 - Guías</title>

    <!-- custom fonts for template -->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- custom styles for template -->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <!-- custom styles for this page -->
    <link href="/vendor/datatables/dataTables.bootstrap4.min.css" rel="stylesheet">

    <style>
        .pfp-container {
            width: 230px;
            height: 230px;
            border: 2px solid #e3e6f0;
            background-color: #f8f9fc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 .125rem .25rem 0 rgba(58,59,69,.2) !important;
        }

        .btn-success-soft {
            color: #28a745;
            background-color: rgba(40, 167, 69, 0.1);
            border: 1px solid rgba(40, 167, 69, 0.2);
        }

        .btn-success-soft:hover {
            background-color: #28a745;
            color: white;
        }

        .pfp-column-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        </style>

</head>

<body id="page-top">

    <div id="wrapper">

        <!-- Sidebar -->
        {{>admin/partials/sidebar}}

        <div id="content-wrapper" class="d-flex flex-column">

            <div id="content">

                <!-- Topbar -->
                <div id="topbar">
                    {{>admin/partials/topbar}} 
                </div> 
            
                <!-- Page Content --> 
                <div class="container-fluid"> 
                    
                    <h1 class="h3 mb-4 text-gray-800">Editar Guía</h1> 
                    
                    <div class="card shadow mb-4"> 
                        <div class="card-header py-3"> 
                            <h6 class="m-0 font-weight-bold text-primary">Datos del guía</h6> 
                        </div> 
                        
                        <div class="card-body"> 
                            
                            <form action="/admin/guides/save" method="post" enctype="multipart/form-data">

                            <input type="hidden" name="{{_csrf.parameterName}}" value="{{_csrf.token}}" />
                            <input type="hidden" name="id" value="{{guide.id}}">

                            <div class="row">

                                <!-- LEFT COLUMN -->
                                <div class="col-md-8">

                                    <div class="form-group">
                                        <label>Nombre</label>
                                        <input type="text" name="name" class="form-control"
                                            value="{{guide.name}}" required>
                                    </div>

                                    <div class="form-group">
                                        <label>Apellido</label>
                                        <input type="text" name="lastName" class="form-control"
                                            value="{{guide.lastName}}" required>
                                    </div>

                                    <div class="form-group">
                                        <label>Precio</label>
                                        <input type="number" step="0.01" name="price"
                                            class="form-control" value="{{guide.price}}" required>
                                    </div>

                                    <div class="form-group">
                                        <label>Activo</label><br>
                                        <input type="checkbox" name="enabled"
                                            {{#guide.enabled}}checked{{/guide.enabled}}>
                                    </div>

                                    <div class="form-group">
                                        <label>Tour asociado</label>
                                        <select name="tourId" class="form-control" required>
                                            {{#tours}}
                                            <option value="{{id}}" {{#selected}}selected{{/selected}}>
                                                {{name}}
                                            </option>
                                            {{/tours}}
                                        </select>
                                    </div>

                                </div>

                                <!-- RIGHT COLUMN (PFP) -->
                                <div class="col-md-4 text-center pfp-column-center">

                                    <label>Foto de perfil</label>

                                    <div class="pfp-container mx-auto">
                                        {{^guide.profilePicture}}
                                        <div id="pfp-placeholder">
                                            <i class="fas fa-user fa-5x text-secondary"></i>
                                        </div>
                                        {{/guide.profilePicture}}

                                        <img id="pfp-preview"
                                            src="{{#guide.profilePicture}}data:image/png;base64,{{guide.profilePicture}}{{/guide.profilePicture}}"
                                            class="img-fluid {{^guide.profilePicture}}d-none{{/guide.profilePicture}}"
                                            style="width: 100%; height: 100%; object-fit: cover;">
                                    </div>

                                    <input type="file" id="imageFile"
                                        name="imageFile" hidden accept="image/*">

                                    <label class="btn btn-success-soft btn-sm"
                                        for="imageFile" style="cursor: pointer;">
                                        <i class="fas fa-camera mr-2"></i>Cambiar imagen
                                    </label>

                                </div>

                            </div>

                            <hr>

                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Guardar
                            </button>

                            <a href="/admin/guides" class="btn btn-secondary">
                                Cancelar
                            </a>

                            </form>
                            
                        </div> 
                    </div>

                </div>
            </div>

            <!-- Footer -->
            <footer id="footer">
                {{>admin/partials/footer}}
            </footer>

        </div>
    </div>

    <!-- Scroll button -->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <div id="logout-modal">
        {{>admin/partials/logout-modal}}
    </div>

    <!-- Scripts --> 
    <script src="/vendor/jquery/jquery.min.js"></script> 
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script> 
    <script src="/vendor/jquery-easing/jquery.easing.min.js"></script> 
    <script src="/js/sb-admin-2.min.js"></script> 
    <script>
        document.getElementById('imageFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('pfp-preview');
                    const placeholder = document.getElementById('pfp-placeholder');
                    preview.src = e.target.result;
                    preview.classList.remove('d-none');
                    if (placeholder) placeholder.classList.add('d-none');
                };
                reader.readAsDataURL(file);
            }
        });
        </script>

</body>

</html>
