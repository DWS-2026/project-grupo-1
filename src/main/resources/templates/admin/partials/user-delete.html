<div class="modal fade" id="deleteUserModal{{id}}" tabindex="-1" role="dialog" aria-labelledby="deleteUserModalLabel{{id}}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content border-0 shadow-lg">

            <div class="modal-header bg-danger text-white border-0">
                <h5 class="modal-title font-weight-bold" id="deleteUserModalLabel{{id}}">
                    <i class="fas fa-user-times mr-2"></i>Eliminar usuario
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body py-4">
                <div class="text-center mb-4">
                    {{#profilePicture}}
                    <img src="data:image/png;base64,{{profilePicture}}"
                         alt="Foto de perfil"
                         class="rounded-circle border border-5 border-danger shadow-sm mb-3"
                         style="width: 110px; height: 110px; object-fit: cover;">
                    {{/profilePicture}}

                    {{^profilePicture}}
                    <div class="rounded-circle border border-5 border-secondary d-inline-flex align-items-center justify-content-center bg-light mb-3"
                         style="width: 110px; height: 110px;">
                        <i class="fas fa-user fa-4x text-secondary"></i>
                    </div>
                    {{/profilePicture}}

                    <h4 class="text-gray-900 font-weight-bold mb-1">{{name}} {{lastName}}</h4>
                    <p class="text-muted small mb-0">{{email}}</p>
                </div>

                <div class="alert alert-warning border-left-danger shadow-sm mx-2" role="alert">
                    <div class="row no-gutters align-items-center">
                        <div class="col-auto mr-3">
                            <i class="fas fa-exclamation-circle fa-2x text-danger"></i>
                        </div>
                        <div class="col">
                            <span class="text-gray-800 font-weight-bold">¡Atención!</span><br>
                            <span class="small">Esta acción borrará permanentemente todos los datos del usuario.</span>
                            <br>
                            <span class="small">No podrás deshacer este cambio.</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer bg-light border-0 justify-content-center py-3">
                <button type="button" class="btn btn-outline-secondary btn-sm px-4 mr-2 shadow-sm" data-dismiss="modal">
                    Cancelar
                </button>

                <form action="/admin/users/delete/{{id}}" method="POST" class="d-inline">
                    <input type="hidden" name="_csrf" value="{{_csrf.token}}" />
                    <button type="submit" class="btn btn-danger btn-sm px-4 shadow-sm">
                        <i class="fas fa-trash-alt mr-1"></i> Confirmar eliminación
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
