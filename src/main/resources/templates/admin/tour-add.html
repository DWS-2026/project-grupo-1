<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>SB Admin 2 - Añadir Tour</title>

    <!-- Custom fonts -->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">


    <!-- Custom styles -->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

</head>

<body id="page-top">

    <div id="wrapper">

        <!-- Sidebar -->
        {{>admin/partials/sidebar}}

        <div id="content-wrapper" class="d-flex flex-column">

            <div id="content">

                <!-- Topbar -->
                <div id="topbar">
                    {{>admin/partials/topbar}}
                </div>

                <div class="container-fluid">

                    <h1 class="h3 mb-4 text-gray-800">Añadir Tour</h1>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Datos del tour</h6>
                        </div>

                        <div class="card-body">

                            <form action="/admin/tour-add" method="post" enctype="multipart/form-data">

                                <!-- CSRF -->
                                <input type="hidden" name="_csrf" value="{{_csrf.token}}" />

                                <div class="form-group">
                                    <label>Nombre del tour</label>
                                    <input type="text" class="form-control" name="name" placeholder="Nombre" required>
                                </div>

                                <div class="form-group">
                                    <label>Precio (€)</label>
                                    <input type="number" step="0.01" class="form-control" name="price"
                                        placeholder="Precio" required>
                                </div>

                                <div class="form-group">
                                    <label>Duración</label>
                                    <input type="text" class="form-control" name="duration" placeholder="Duración">
                                </div>

                                <div class="form-group">
                                    <label>Número de personas</label>
                                    <input type="number" class="form-control" name="numPeople"
                                        placeholder="Número de personas">
                                </div>

                                <div class="form-group">
                                    <label>Hotel incluido</label>
                                    <select class="form-control" name="hotelIncluded">
                                        <option value="true">Incluido</option>
                                        <option value="false">No incluido</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Descripción</label>
                                    <textarea class="form-control" name="description" rows="4"></textarea>
                                </div>

                                <div class="form-group">
                                    <label>Imagen del tour</label>
                                    <input type="file" class="form-control-file" name="imageFile">
                                </div>

                                <hr>

                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save"></i> Añadir Tour
                                </button>

                                <a href="/admin/tours" class="btn btn-secondary">
                                    Cancelar
                                </a>

                            </form>


                        </div>
                    </div>

                </div>

            </div>

            <!-- Footer -->
            <footer id="footer">
                {{>admin/partials/footer}}
            </footer>

        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <div id="logout-modal">
        {{>admin/partials/logout-modal}}
    </div>

    <!-- Scripts -->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>

</body>

</html>
