server.port = 8443
server.ssl.key-store = classpath:keystore.jks
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password = password
server.ssl.key-password = password

spring.mustache.suffix=.html

spring.datasource.url=jdbc:mysql://localhost:3306/apex_project?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=passwd
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# NOT CREATE so we achieve persistence 
spring.jpa.hibernate.ddl-auto=update

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# key for remember me cookie
security.rememberme.key=superSecretApexExpeditions1234!