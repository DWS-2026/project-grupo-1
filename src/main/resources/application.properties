server.port = 8443
server.ssl.key-store = classpath:keystore.jks
server.ssl.key-store-password = password
server.ssl.key-password = secret

spring.mustache.suffix=.html

# modificado de template
spring.datasource.url=jdbc:mysql://localhost:3306/apex_project
spring.datasource.username=root
spring.datasource.password=passwd
spring.jpa.hibernate.ddl-auto=update

# Necessary to be able to use accents and the letter ñ
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# anadido
# Forzamos el dialecto para que Hibernate no intente adivinarlo y falle
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect